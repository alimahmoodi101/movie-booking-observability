global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "movie-booking-api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          machine: "movie-booking-host"

  - job_name: 'grpc-service'
    static_configs:
      - targets: ['grpc:8001']
        labels:
          service: 'movie-booking-grpc'
