syntax = "proto3";

package booking;

service BookingService {
  rpc HoldSeats (HoldRequest) returns (HoldResponse);
}

message HoldRequest {
  int32 showtime_id = 1;
  repeated int32 seat_ids = 2;
  string user_id = 3;
}

message HoldResponse {
  repeated int32 held_seat_ids = 1;
  int32 expires_in_seconds = 2;
  string request_id = 3;
}