filebeat.inputs:
  - type: container
    paths:
      - "/var/lib/docker/containers/*/*.log"
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
          expand_keys: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]

setup.ilm.enabled: false
setup.template.enabled: false

logging.level: info